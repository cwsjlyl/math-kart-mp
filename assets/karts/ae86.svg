<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <defs>
    <linearGradient id="akinaSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pandaWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0.3">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#akinaSky)"/>
  <!-- Akina Mountain Silhouette -->
  <polygon points="0,158 95,88 188,136 292,72 395,124 480,82 480,195 0,195" fill="#111827"/>
  <!-- Anime Manga Speed Lines -->
  <g stroke="#e2e8f0" stroke-opacity="0.28" stroke-width="2.5">
    <line x1="300" y1="32" x2="480" y2="18"/>
    <line x1="330" y1="54" x2="480" y2="45"/>
    <line x1="350" y1="78" x2="480" y2="72"/>
    <line x1="0" y1="52" x2="140" y2="44"/>
  </g>
  <!-- Touge Asphalt & Yellow Center Line & Gutter -->
  <polygon points="0,192 480,168 480,270 0,270" fill="#1f2937"/>
  <line x1="0" y1="242" x2="480" y2="206" stroke="#f59e0b" stroke-width="5"/>
  <line x1="0" y1="198" x2="480" y2="173" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Headlight Beams -->
  <polygon points="74,150 0,174 0,214 82,168" fill="url(#beam)"/>
  <!-- Drift Tire Smoke -->
  <g fill="#e2e8f0" opacity="0.55">
    <circle cx="388" cy="194" r="24"/><circle cx="418" cy="184" r="30"/><circle cx="450" cy="172" r="26"/>
  </g>
  <!-- Ground Shadow -->
  <ellipse cx="236" cy="208" rx="166" ry="20" fill="#020617" opacity="0.78"/>
  <!-- AE86 Panda Trueno 3-Door Hatchback -->
  <g stroke="#090d16" stroke-width="3.8" stroke-linejoin="round">
    <!-- Rear Ducktail Spoiler -->
    <polygon points="382,120 404,114 404,128 384,132" fill="#18181b"/>
    <!-- Upper Panda White Body + Fastback Roof -->
    <path d="M68,156 L156,136 L212,92 L326,92 L396,128 L398,162 L68,166 Z" fill="url(#pandaWhite)"/>
    <!-- Black Carbon Hood -->
    <polygon points="72,154 158,135 174,142 84,160" fill="#18181b"/>
    <!-- Pop-Up Retractable Headlights (Open!) -->
    <polygon points="74,150 96,134 110,136 106,154" fill="#18181b"/>
    <rect x="74" y="139" width="14" height="11" rx="2" fill="#fef9c3"/>
    <!-- Cabin Windows (Windshield + Side + Fastback Quarter Glass) -->
    <polygon points="166,134 214,98 242,98 202,134" fill="#38bdf8" fill-opacity="0.58"/>
    <polygon points="218,98 292,98 290,132 208,134" fill="#1e293b"/>
    <polygon points="300,98 324,98 378,128 298,132" fill="#334155"/>
    <!-- Lower Panda Black Two-Tone Trim & Bumpers -->
    <path d="M58,164 L404,158 L406,184 L380,188 L64,190 L56,178 Z" fill="#111827"/>
    <!-- Panda Mid-Door Black Rub Strip -->
    <line x1="168" y1="152" x2="386" y2="148" stroke="#111827" stroke-width="5"/>
    <!-- Front Yellow JDM Fog Lights & Amber Signal -->
    <circle cx="68" cy="176" r="6" fill="#facc15"/>
    <rect x="82" y="170" width="16" height="6" rx="2" fill="#f97316"/>
    <!-- Rear Trueno Red/Amber Taillight Corner -->
    <rect x="392" y="140" width="10" height="16" fill="#ef4444"/>
    <!-- 8-Spoke Dark Gunmetal RS Watanabe Wheels -->
    <circle cx="138" cy="184" r="33" fill="#090d16"/>
    <circle cx="138" cy="184" r="21" fill="#cbd5e1"/>
    <circle cx="138" cy="184" r="17" fill="#27272a"/>
    <g stroke="#52525b" stroke-width="2.5">
      <line x1="138" y1="168" x2="138" y2="200"/><line x1="122" y1="184" x2="154" y2="184"/>
      <line x1="127" y1="173" x2="149" y2="195"/><line x1="149" y1="173" x2="127" y2="195"/>
    </g>
    <circle cx="338" cy="180" r="34" fill="#090d16"/>
    <circle cx="338" cy="180" r="22" fill="#cbd5e1"/>
    <circle cx="338" cy="180" r="18" fill="#27272a"/>
    <g stroke="#52525b" stroke-width="2.5">
      <line x1="338" y1="163" x2="338" y2="197"/><line x1="321" y1="180" x2="355" y2="180"/>
      <line x1="326" y1="168" x2="350" y2="192"/><line x1="350" y1="168" x2="326" y2="192"/>
    </g>
  </g>
  <!-- Fujiwara Tofu Door Lettering -->
  <text x="206" y="147" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="11.5">藤原とうふ店(自家用)</text>
  <text x="22" y="42" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="24" font-style="italic" letter-spacing="1.5">AE86 TRUENO</text>
</svg>
